
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jagannath's Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="main-container">

        <!-- Profile Section -->
        <div class="profile">

            <div class="profile-image">
                <img src="image.png" alt="Jagannath Tripathy">
            </div>

            <h1>Jagannath Tripathy</h1>

            <p class="designation">Full Stack Developer</p>

            <p class="tagline">
                Turning ideas into digital experiences.
            </p>

        </div>


        <!-- Calculator Section -->
        <div class="calculator">

            <div class="calculator-header">
                <h2>Calculator</h2>
                <span class="status">● Online</span>
            </div>

            <div class="display-container">
                <div id="previous-operand"></div>
                <input type="text" id="display"
                    placeholder="0" readonly>
            </div>

            <div class="buttons">

                <button class="operator" onclick="clearDisplay()">AC</button>
                <button class="operator" onclick="deleteNumber()">DEL</button>
                <button class="operator" onclick="appendValue('%')">%</button>
                <button class="operator" onclick="appendValue('/')">÷</button>

                <button onclick="appendValue('7')">7</button>
                <button onclick="appendValue('8')">8</button>
                <button onclick="appendValue('9')">9</button>
                <button class="operator" onclick="appendValue('*')">×</button>

                <button onclick="appendValue('4')">4</button>
                <button onclick="appendValue('5')">5</button>
                <button onclick="appendValue('6')">6</button>
                <button class="operator" onclick="appendValue('-')">−</button>

                <button onclick="appendValue('1')">1</button>
                <button onclick="appendValue('2')">2</button>
                <button onclick="appendValue('3')">3</button>
                <button class="operator" onclick="appendValue('+')">+</button>

                <button onclick="appendValue('0')">0</button>
                <button onclick="appendValue('.')">.</button>
                <button class="equal" onclick="calculate()">=</button>

            </div>

        </div>


        <!-- Footer -->
        <footer>
            <p>Designed & Developed by <strong>Jagannath Tripathy</strong></p>
            <p class="footer-text">© 2026 All Rights Reserved</p>
        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>
